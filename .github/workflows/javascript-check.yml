name: Verificación de JavaScript
on:
  pull_request:
  push:
    branches:
      - mejoras-seguridad-condominios-oct2026
jobs:
  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/condominios.js
